<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muhammadamin Pulatov — Group 201 portfolio sahifasi.">
  <meta name="theme-color" content="#fafafa">
  <title>Muhammadamin Pulatov</title>
  <style>
    :root {
      --ink: #181818;
      --muted: #727272;
      --line: #e7e7e7;
      --wash: #fafafa;
    }

    :root[data-theme="dark"] {
      --ink: #f5f5f5;
      --muted: #9a9a9a;
      --line: #292929;
      --wash: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 500ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    body,
    .project,
    .project::before,
    footer,
    .theme-toggle {
      transition-property: background, color, border-color;
      transition-duration: 500ms;
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
    }

    .shell {
      width: min(960px, calc(100% - 64px));
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      z-index: 10;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--wash);
      color: var(--ink);
      cursor: pointer;
      font: 700 16px/1 Arial, Helvetica, sans-serif;
      transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
                  background 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .theme-toggle:hover {
      transform: rotate(12deg) scale(1.06);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    main {
      min-height: calc(100vh - 72px);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      align-items: end;
      gap: 40px;
      min-height: 340px;
      padding: 64px 0 58px;
      border-bottom: 1px solid var(--line);
    }

    .intro h1 {
      max-width: 740px;
      margin: 0;
      font-size: clamp(54px, 8vw, 88px);
      font-weight: 600;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    .intro h1 span {
      display: inline;
      margin-left: 12px;
      color: var(--muted);
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: -0.06em;
      white-space: nowrap;
      vertical-align: 12%;
    }

    .meta {
      display: grid;
      gap: 7px;
      padding-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
      animation: pulse 2.4s ease-in-out infinite;
    }

    .works {
      padding: 38px 0 64px;
    }

    .works-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .works-heading h2,
    .works-heading p {
      margin: 0;
      font-size: 14px;
    }

    .works-heading h2 {
      font-weight: 700;
    }

    .works-heading p {
      color: var(--muted);
    }

    .project {
      display: grid;
      position: relative;
      grid-template-columns: 76px minmax(0, 1fr) auto 24px;
      align-items: center;
      gap: 18px;
      min-height: 108px;
      overflow: hidden;
      border-top: 1px solid var(--line);
    }

    .project::before {
      position: absolute;
      left: 0;
      width: 28px;
      height: 1px;
      background: var(--ink);
      content: "";
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover::before {
      transform: scaleX(1);
    }

    .project:last-child {
      border-bottom: 1px solid var(--line);
    }

    .project-number,
    .project-kind {
      color: var(--muted);
      font-size: 13px;
    }

    .project-number {
      color: var(--ink);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .project-name {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.035em;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project-arrow {
      font-size: 22px;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover .project-name {
      transform: translateX(10px);
    }

    .project:hover .project-arrow {
      transform: translateX(7px);
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      transition: color 180ms ease;
    }

    footer a:hover {
      color: var(--ink);
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .social-links a {
      position: relative;
    }

    .social-links a::after {
      position: absolute;
      right: 0;
      bottom: -4px;
      left: 0;
      height: 1px;
      background: var(--ink);
      content: "";
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .social-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .intro,
    .works {
      animation: reveal 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .works {
      animation-delay: 100ms;
    }

    .project {
      opacity: 0;
      animation: project-reveal 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .project:nth-of-type(1) {
      animation-delay: 220ms;
    }

    .project:nth-of-type(2) {
      animation-delay: 320ms;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes project-reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.75);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 700px) {
      .shell {
        width: min(100% - 36px, 960px);
      }

      main {
        min-height: calc(100vh - 64px);
      }

      .intro {
        grid-template-columns: 1fr;
        align-items: end;
        gap: 30px;
        min-height: 300px;
        padding: 52px 0 42px;
      }

      .intro h1 {
        font-size: clamp(48px, 15vw, 68px);
      }

      .intro h1 span {
        display: block;
        margin-top: 18px;
        margin-left: 0;
        font-size: clamp(24px, 7vw, 34px);
      }

      .meta {
        grid-template-columns: auto 1fr;
        align-items: baseline;
        gap: 12px;
      }

      .theme-toggle {
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
      }

      .project {
        grid-template-columns: 48px minmax(0, 1fr) 20px;
        gap: 12px;
        min-height: 92px;
      }

      .project-number {
        font-size: 24px;
      }

      .project-name {
        font-size: 20px;
      }

      .project-kind {
        display: none;
      }

      footer {
        min-height: 64px;
      }
    }

    @media (max-width: 380px) {
      .shell {
        width: min(100% - 28px, 960px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Qorong‘i rejimni yoqish" title="Rang rejimini almashtirish">
    <span aria-hidden="true">◐</span>
  </button>
  <div class="shell">
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">Muhammadamin<br>Pulatov <span>Group 201</span></h1>
        <div class="meta">
          <span class="status">Web dasturlash</span>
        </div>
      </section>

      <section class="works" id="works" aria-labelledby="works-title">
        <div class="works-heading">
          <h2 id="works-title">Loyihalar</h2>
          <p>2 ish</p>
        </div>

        <a class="project" href="./FlexBox/index.html">
          <span class="project-number">01</span>
          <span class="project-name">Flexbox mashqlari</span>
          <span class="project-kind">HTML / CSS</span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>

        <a class="project" href="./ipak-yoli/index.html">
          <span class="project-number">02</span>
          <span class="project-name">Ipak yo‘li Tours</span>
          <span class="project-kind">Sayohat sahifasi</span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
      </section>
    </main>

    <footer>
      <span>© 2026</span>
      <div class="social-links">
        <a href="https://github.com/MuhammadaminPulatov" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="../../">Guruh 201</a>
      </div>
    </footer>
  </div>
  <script>
    const root = document.documentElement;
    const themeToggle = document.querySelector(".theme-toggle");
    const savedTheme = localStorage.getItem("portfolio-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const startTheme = savedTheme || (prefersDark ? "dark" : "light");

    function applyTheme(theme) {
      root.dataset.theme = theme;
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Yorug‘ rejimga o‘tish" : "Qorong‘i rejimga o‘tish"
      );
      themeToggle.querySelector("span").textContent = theme === "dark" ? "◑" : "◐";
      document.querySelector('meta[name="theme-color"]').setAttribute(
        "content",
        theme === "dark" ? "#111111" : "#fafafa"
      );
    }

    applyTheme(startTheme);

    themeToggle.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("portfolio-theme", nextTheme);
      applyTheme(nextTheme);
    });
  </script>
</body>
</html>
