<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muhammadamin Pulatov - web development portfolio">
  <meta name="theme-color" content="#fafafa">
  <title>Muhammadamin Pulatov</title>
  <style>
    :root {
      --background: #fafafa;
      --foreground: #171717;
      --muted: #737373;
      --line: #e5e5e5;
      --hover: #ededed;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --background: #000000;
      --foreground: #ffffff;
      --muted: #a3a3a3;
      --line: #262626;
      --hover: #171717;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 400ms ease, color 400ms ease;
      overflow: hidden;
    }

    a,
    button {
      color: inherit;
    }

    a {
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--foreground);
      outline-offset: 5px;
    }

    .shell {
      width: min(960px, calc(100% - 64px));
      margin: 0 auto;
    }

    .floating-control {
      position: fixed;
      z-index: 20;
      top: 24px;
      display: inline-grid;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--background);
      transition: transform 220ms ease, background 400ms ease, border-color 400ms ease;
    }

    .floating-control:hover {
      border-color: var(--foreground);
    }

    .back-button {
      left: 24px;
      grid-auto-flow: column;
      gap: 8px;
      padding: 0 14px;
      color: var(--foreground);
      cursor: pointer;
      font: 700 13px/1 Arial, Helvetica, sans-serif;
    }

    .back-button:hover {
      transform: translateX(-3px);
    }

    .theme-button {
      right: 24px;
      width: 44px;
      cursor: pointer;
    }

    .theme-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    .theme-button:hover {
      transform: rotate(12deg);
    }

    .theme-button:active,
    .back-button:active {
      transform: scale(0.96);
    }

    main {
      min-height: calc(100vh - 72px);
    }

    .intro {
      position: relative;
      display: flex;
      min-height: 340px;
      align-items: flex-end;
      padding: 64px 0 58px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(54px, 8vw, 88px);
      font-weight: 700;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    h1 a {
      position: absolute;
      right: 0;
      bottom: 58px;
    }

    h1 span {
      display: block;
      color: var(--foreground);
      font-size: clamp(92px, 15vw, 150px);
      letter-spacing: -0.09em;
      line-height: 0.75;
      opacity: 0.1;
      transition: opacity 300ms ease, color 300ms ease;
    }

    h1 a:hover span {
      opacity: 0.18;
    }

    .works {
      display: flex;
      height: calc(100vh - 412px);
      min-height: 180px;
      flex-direction: column;
      padding: 56px 0 64px;
    }

    .works-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex: none;
    }

    .works-heading h2,
    .works-heading p {
      margin: 0;
    }

    .works-heading h2 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .works-heading p {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .works-heading p::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--foreground);
      content: "";
    }

    .project-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .project-list::-webkit-scrollbar {
      width: 4px;
    }

    .project-list::-webkit-scrollbar-thumb {
      background: var(--line);
    }

    .project {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      min-height: 108px;
      align-items: center;
      gap: 18px;
      padding: 0 18px 0 12px;
      border-top: 1px solid var(--line);
      transition: background 300ms ease, border-color 300ms ease;
    }

    .project:last-child {
      border-bottom: 1px solid var(--line);
    }

    .project-number {
      color: var(--foreground);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.06em;
    }

    .project-copy {
      display: grid;
      gap: 5px;
    }

    .project-name {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.035em;
      transition: transform 300ms ease;
    }

    .project-description,
    .project-action {
      color: var(--muted);
      font-size: 13px;
    }

    .project-action {
      display: flex;
      min-width: 86px;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .project-arrow {
      font-size: 20px;
      transition: transform 300ms ease;
    }

    .project:hover,
    .project:active {
      background: transparent;
    }

    .project:hover .project-name,
    .project:active .project-name {
      transform: translateX(8px);
    }

    .project:hover .project-arrow,
    .project:active .project-arrow {
      transform: translateX(5px);
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .social-links a {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 50%;
      transition: background 220ms ease, color 220ms ease;
    }

    .social-links a:hover {
      color: var(--foreground);
    }

    .social-links svg {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 700px) {
      .shell {
        width: calc(100% - 36px);
      }

      .floating-control {
        top: 16px;
      }

      .back-button {
        left: 16px;
        height: 40px;
        min-height: 40px;
      }

      .theme-button {
        right: 16px;
        width: 40px;
        height: 40px;
      }

      main {
        min-height: calc(100vh - 64px);
      }

      .intro {
        min-height: 300px;
        padding: 112px 0 42px;
      }

      .works {
        height: calc(100vh - 300px - 64px);
        min-height: 150px;
        padding: 44px 0 32px;
      }

      .works-heading {
        margin-bottom: 22px;
      }

      .works-heading h2 {
        font-size: 28px;
      }

      .works-heading p {
        font-size: 12px;
      }

      h1 {
        font-size: clamp(48px, 15vw, 68px);
      }

      h1 span {
        display: block;
        font-size: clamp(72px, 24vw, 112px);
      }

      h1 a {
        right: 0;
        bottom: 42px;
      }

      .project {
        grid-template-columns: 48px minmax(0, 1fr) 24px;
        gap: 12px;
        min-height: 92px;
        padding: 0 12px 0 8px;
      }

      .project-number {
        font-size: 24px;
      }

      .project-name {
        font-size: 20px;
      }

      .project-description,
      .project-action-text {
        display: none;
      }

      footer {
        min-height: 64px;
      }
    }

    @media (max-width: 380px) {
      .shell {
        width: calc(100% - 28px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <button class="floating-control back-button" type="button" aria-label="Go back">← Back</button>
  <button class="floating-control theme-button" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"></path>
    </svg>
  </button>

  <div class="shell">
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">
          Muhammadamin
          <br>Pulatov
          <a href="../../" aria-label="Open 201"><span>201</span></a>
        </h1>
      </section>

      <section class="works" id="works" aria-labelledby="works-title">
        <div class="works-heading">
          <h2 id="works-title">Projects</h2>
          <p>Latest first</p>
        </div>

        <div class="project-list">
        <a class="project" href="./ipak-yoli/index.html" aria-label="Open Ipak yo'li Tours">
          <span class="project-number">01</span>
          <span class="project-copy">
            <span class="project-name">Ipak yo‘li Tours</span>
            <span class="project-description">A travel website about Samarkand</span>
          </span>
          <span class="project-action">
            <span class="project-action-text">Open</span>
            <span class="project-arrow" aria-hidden="true">→</span>
          </span>
        </a>

        <a class="project" href="./FlexBox/index.html" aria-label="Open Flexbox exercises">
          <span class="project-number">02</span>
          <span class="project-copy">
            <span class="project-name">Flexbox exercises</span>
            <span class="project-description">HTML and CSS practice</span>
          </span>
          <span class="project-action">
            <span class="project-action-text">Open</span>
            <span class="project-arrow" aria-hidden="true">→</span>
          </span>
        </a>
        </div>
      </section>
    </main>

    <footer>
      <span>© 2026</span>
      <div class="social-links">
        <a href="https://github.com/MuhammadaminPulatov" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.91-2.78.61-3.37-1.2-3.37-1.2-.45-1.18-1.11-1.49-1.11-1.49-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.64-1.35-2.22-.26-4.56-1.13-4.56-5.02 0-1.11.39-2.02 1.03-2.73-.1-.26-.45-1.29.1-2.69 0 0 .84-.27 2.75 1.04A9.4 9.4 0 0 1 12 7.9c.85 0 1.71.12 2.51.34 1.9-1.31 2.74-1.04 2.74-1.04.55 1.4.2 2.43.1 2.69.64.71 1.03 1.62 1.03 2.73 0 3.9-2.34 4.76-4.57 5.01.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/>
          </svg>
        </a>
        <a href="https://instagram.com/YoshFounder.uz" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
        <a href="https://t.me/Muhammadamin_Pulatov" target="_blank" rel="noopener noreferrer" aria-label="Telegram profile">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M21.4 4.1 18.2 19c-.24 1.07-.87 1.33-1.76.83l-4.86-3.58-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.92 8.96-8.1c.39-.35-.09-.54-.6-.19L6.3 12.7l-4.82-1.51c-1.05-.33-1.07-1.05.22-1.55L19.99 3.1c.87-.33 1.63.2 1.41 1Z"/>
          </svg>
        </a>
      </div>
    </footer>
  </div>

  <script>
    const root = document.documentElement;
    const themeButton = document.querySelector(".theme-button");
    const savedTheme = localStorage.getItem("portfolio-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    function applyTheme(theme) {
      root.dataset.theme = theme;
      const isDark = theme === "dark";
      themeButton.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
      themeButton.setAttribute("aria-pressed", String(isDark));
      document.querySelector('meta[name="theme-color"]').content = isDark ? "#000000" : "#fafafa";
    }

    applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

    themeButton.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("portfolio-theme", nextTheme);
      applyTheme(nextTheme);
    });

    document.querySelector(".back-button").addEventListener("click", () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = "../../";
      }
    });
  </script>
</body>
</html>
