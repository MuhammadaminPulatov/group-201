<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muhammadamin Pulatov - web development portfolio">
  <meta name="theme-color" content="#fafafa">
  <title>Muhammadamin Pulatov</title>
  <style>
    :root {
      --ink: #181818;
      --muted: #727272;
      --line: #e7e7e7;
      --wash: #fafafa;
      --group-mark-opacity: 0.48;
      --group-mark-hover-opacity: 0.62;
    }

    :root[data-theme="dark"] {
      --ink: #ffffff;
      --muted: #aaaaaa;
      --line: #242424;
      --wash: #000000;
      --group-mark-opacity: 0.4;
      --group-mark-hover-opacity: 0.55;
      color-scheme: dark;
    }

    :root:not([data-theme="dark"]) {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--wash);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 500ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    body,
    footer,
    .utility-control {
      transition-property: background, color, border-color;
      transition-duration: 500ms;
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
    }

    .shell {
      position: relative;
      width: min(960px, calc(100% - 64px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .utility-bar {
      position: absolute;
      z-index: 10;
      top: 24px;
      right: 0;
      left: 0;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .utility-control {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--wash);
      color: var(--ink);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
                  background 500ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .back-button {
      padding: 0;
      border-radius: 50%;
    }

    .back-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .back-button:hover {
      transform: translateX(-3px);
    }

    .back-button:active {
      transform: scale(0.94);
    }

    .theme-toggle {
      border-radius: 50%;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    .theme-toggle:hover {
      transform: rotate(12deg) scale(1.06);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    main {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .intro {
      position: relative;
      display: flex;
      align-items: flex-end;
      min-height: 340px;
      flex: none;
      padding: 64px 0 58px;
      border-bottom: 1px solid var(--line);
      isolation: isolate;
    }

    .intro h1 {
      position: relative;
      z-index: 1;
      max-width: 740px;
      margin: 0;
      pointer-events: none;
      font-size: clamp(54px, 8vw, 88px);
      font-weight: 600;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    .group-mark {
      position: absolute;
      right: 0;
      bottom: 42px;
      z-index: 0;
      color: var(--ink);
      font-size: clamp(112px, 22vw, 220px);
      font-weight: 700;
      letter-spacing: -0.1em;
      line-height: 0.75;
      opacity: var(--group-mark-opacity);
      transition: opacity 320ms ease,
                  transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .group-mark:hover,
    .group-mark:focus-visible {
      opacity: var(--group-mark-hover-opacity);
      transform: translateY(-4px);
    }

    .works {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 38px 0 32px;
    }

    .works-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .works-heading h2,
    .works-heading p {
      margin: 0;
      font-size: 14px;
    }

    .works-heading h2 {
      font-weight: 700;
    }

    .works-heading p {
      color: var(--muted);
    }

    .project-list {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-color: var(--line) transparent;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .project-list::-webkit-scrollbar {
      width: 4px;
    }

    .project-list::-webkit-scrollbar-thumb {
      background: var(--line);
    }

    .project {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 24px;
      align-items: center;
      gap: 18px;
      min-height: 108px;
      padding-right: 14px;
      border-top: 1px solid var(--line);
      isolation: isolate;
    }

    .project:last-child {
      border-bottom: 1px solid var(--line);
    }

    .project:focus-visible {
      outline-offset: -4px;
    }

    .project-number {
      color: var(--ink);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .project-name {
      min-width: 0;
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.035em;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project-arrow {
      font-size: 22px;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover .project-name,
    .project:active .project-name {
      transform: translateX(10px);
    }

    .project:hover .project-arrow,
    .project:active .project-arrow {
      transform: translateX(7px);
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .social-links a {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 50%;
      transition: opacity 220ms ease,
                  transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .social-links a:hover,
    .social-links a:active {
      opacity: 0.68;
      transform: translateY(-3px);
    }

    .social-links svg {
      width: 18px;
      height: 18px;
    }

    .intro,
    .works {
      animation: reveal 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .works {
      animation-delay: 60ms;
    }

    .project {
      opacity: 0;
      animation: project-reveal 450ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .project:nth-of-type(1) {
      animation-delay: 120ms;
    }

    .project:nth-of-type(2) {
      animation-delay: 180ms;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes project-reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .shell {
        width: min(100% - 36px, 960px);
      }

      .intro {
        align-items: flex-end;
        min-height: clamp(230px, 30vh, 270px);
        padding: 80px 0 60px;
      }

      .intro h1 {
        width: 100%;
        max-width: 100%;
        font-size: clamp(38px, 12vw, 54px);
      }

      .group-mark {
        bottom: 8px;
        font-size: clamp(88px, 27vw, 150px);
      }

      .utility-bar {
        top: 16px;
      }

      .utility-control {
        width: 40px;
        height: 40px;
      }

      .project {
        grid-template-columns: 48px minmax(0, 1fr) 20px;
        gap: 12px;
        min-height: 92px;
      }

      .project-number {
        font-size: 24px;
        text-align: center;
      }

      .project-name {
        font-size: 20px;
      }

      .works {
        padding: 28px 0 20px;
      }

      footer {
        min-height: 64px;
        flex: none;
      }

      .social-links {
        gap: 1px;
      }

      .social-links a {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 380px) {
      .shell {
        width: min(100% - 28px, 960px);
      }
    }

    @media (max-width: 300px) {
      .intro h1 {
        font-size: clamp(30px, 11vw, 34px);
      }

      .social-links {
        gap: 2px;
      }

      .social-links a {
        width: 36px;
        height: 36px;
      }
    }

    @media (max-height: 500px) {
      .intro {
        min-height: 200px;
        padding: 64px 0 24px;
      }

      .intro h1 {
        font-size: clamp(42px, 6vw, 64px);
      }

      .group-mark {
        bottom: 18px;
        font-size: clamp(100px, 18vw, 170px);
      }

      .works {
        padding: 16px 0 10px;
      }

      .works-heading {
        margin-bottom: 8px;
      }

      .project {
        min-height: 72px;
      }
    }

    @media (max-width: 700px) and (max-height: 500px) {
      .intro {
        min-height: 134px;
        padding: 56px 0 8px;
      }

      .intro h1 {
        font-size: clamp(30px, 7vw, 38px);
      }

      .group-mark {
        bottom: 10px;
        font-size: clamp(70px, 17vw, 100px);
      }

      .works {
        padding: 12px 0 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .project-list {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <script>
    const root = document.documentElement;
    const themeToggle = document.querySelector(".theme-toggle");
    const savedTheme = localStorage.getItem("portfolio-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const startTheme = savedTheme || (prefersDark ? "dark" : "light");

    function applyTheme(theme) {
      root.dataset.theme = theme;
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
      );
      themeToggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      document.querySelector('meta[name="theme-color"]').setAttribute(
        "content",
        theme === "dark" ? "#000000" : "#fafafa"
      );
    }

    applyTheme(startTheme);

    themeToggle.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("portfolio-theme", nextTheme);
      applyTheme(nextTheme);
    });

    document.querySelector(".back-button").addEventListener("click", () => {
      const previousPageIsLocal = document.referrer &&
        new URL(document.referrer).origin === window.location.origin;

      if (previousPageIsLocal) {
        history.back();
      } else {
        window.location.href = "../../";
      }
    });
  </script>
