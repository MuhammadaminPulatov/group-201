<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muhammadamin Pulatov — Group 201 portfolio sahifasi.">
  <meta name="theme-color" content="#ffffff">
  <title>Muhammadamin Pulatov</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #777777;
      --line: #dedede;
      --paper: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 5px;
    }

    .shell {
      width: min(820px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      min-height: 84px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    nav {
      display: flex;
      gap: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    nav a,
    footer a {
      transition: color 180ms ease;
    }

    nav a:hover,
    footer a:hover {
      color: var(--ink);
    }

    main {
      min-height: calc(100vh - 84px - 68px);
      padding: 76px 0 64px;
    }

    .identity {
      margin-bottom: 72px;
    }

    .identity h1 {
      max-width: 620px;
      margin: 0 0 14px;
      font-size: clamp(38px, 8vw, 72px);
      font-weight: 600;
      letter-spacing: -0.07em;
      line-height: 0.98;
    }

    .group {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .works-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .works-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .works-heading span {
      color: var(--muted);
      font-size: 13px;
    }

    .project-list {
      border-top: 1px solid var(--line);
    }

    .project {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 16px;
      min-height: 82px;
      border-bottom: 1px solid var(--line);
      transition: padding 220ms cubic-bezier(0.22, 1, 0.36, 1),
                  background 220ms ease;
    }

    .project:hover {
      padding-right: 8px;
      padding-left: 8px;
      background: #f7f7f7;
    }

    .project-number {
      color: var(--muted);
      font-size: 12px;
    }

    .project-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .project-arrow {
      color: var(--muted);
      font-size: 16px;
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 180ms ease;
    }

    .project:hover .project-arrow {
      transform: translateX(4px);
      color: var(--ink);
    }

    footer {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .shell {
        width: min(100% - 32px, 820px);
      }

      header {
        min-height: 72px;
      }

      nav {
        gap: 14px;
        font-size: 13px;
      }

      main {
        min-height: calc(100vh - 72px - 60px);
        padding: 56px 0 48px;
      }

      .identity {
        margin-bottom: 56px;
      }

      .identity h1 {
        max-width: 420px;
        font-size: clamp(40px, 13vw, 58px);
      }

      .works-heading span {
        display: none;
      }

      .project {
        grid-template-columns: 34px minmax(0, 1fr) 18px;
        gap: 12px;
        min-height: 76px;
      }

      .project-name {
        font-size: 16px;
      }

      footer {
        min-height: 60px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="name" href="./">Muhammadamin Pulatov</a>
      <nav aria-label="Sahifa navigatsiyasi">
        <a href="#works">Ishlarim</a>
        <a href="../../">Guruh 201</a>
      </nav>
    </header>

    <main>
      <section class="identity" aria-labelledby="intro-title">
        <h1 id="intro-title">Muhammadamin</h1>
        <p class="group">Group 201</p>
      </section>

      <section id="works" aria-labelledby="works-title">
        <div class="works-heading">
          <h2 id="works-title">Loyihalar</h2>
          <span>2 loyiha</span>
        </div>
        <div class="project-list">
          <a class="project" href="./FlexBox/index.html">
            <span class="project-number">01</span>
            <span class="project-name">Flexbox mashqlari</span>
            <span class="project-arrow" aria-hidden="true">→</span>
          </a>
          <a class="project" href="./ipak-yoli/index.html">
            <span class="project-number">02</span>
            <span class="project-name">Ipak yo‘li Tours</span>
            <span class="project-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <span>© 2026</span>
      <a href="../../">Guruh 201 ga qaytish</a>
    </footer>
  </div>
</body>
</html>
