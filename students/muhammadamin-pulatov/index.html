<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muhammadamin Pulatov — Group 201 portfolio sahifasi.">
  <meta name="theme-color" content="#fafafa">
  <title>Muhammadamin Pulatov</title>
  <style>
    :root {
      --ink: #181818;
      --muted: #727272;
      --line: #e7e7e7;
      --wash: #fafafa;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
    }

    .shell {
      width: min(960px, calc(100% - 64px));
      margin: 0 auto;
    }

    main {
      min-height: calc(100vh - 72px);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      align-items: end;
      gap: 40px;
      min-height: 340px;
      padding: 64px 0 58px;
      border-bottom: 1px solid var(--line);
    }

    .intro h1 {
      max-width: 740px;
      margin: 0;
      font-size: clamp(54px, 8vw, 88px);
      font-weight: 600;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    .intro h1 span {
      display: inline;
      margin-left: 12px;
      color: var(--muted);
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: -0.06em;
      white-space: nowrap;
      vertical-align: 12%;
    }

    .meta {
      display: grid;
      gap: 7px;
      padding-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .works {
      padding: 38px 0 64px;
    }

    .works-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .works-heading h2,
    .works-heading p {
      margin: 0;
      font-size: 14px;
    }

    .works-heading h2 {
      font-weight: 700;
    }

    .works-heading p {
      color: var(--muted);
    }

    .project {
      display: grid;
      position: relative;
      grid-template-columns: 76px minmax(0, 1fr) auto 24px;
      align-items: center;
      gap: 18px;
      min-height: 108px;
      overflow: hidden;
      border-top: 1px solid var(--line);
    }

    .project::before {
      position: absolute;
      left: 0;
      width: 28px;
      height: 1px;
      background: var(--ink);
      content: "";
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover::before {
      transform: scaleX(1);
    }

    .project:last-child {
      border-bottom: 1px solid var(--line);
    }

    .project-number,
    .project-kind {
      color: var(--muted);
      font-size: 13px;
    }

    .project-number {
      color: var(--ink);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .project-name {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.035em;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project-arrow {
      font-size: 22px;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover .project-name {
      transform: translateX(10px);
    }

    .project:hover .project-arrow {
      transform: translateX(7px);
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      transition: color 180ms ease;
    }

    footer a:hover {
      color: var(--ink);
    }

    .intro,
    .works {
      animation: reveal 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .works {
      animation-delay: 100ms;
    }

    .project {
      opacity: 0;
      animation: project-reveal 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .project:nth-of-type(1) {
      animation-delay: 220ms;
    }

    .project:nth-of-type(2) {
      animation-delay: 320ms;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes project-reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .shell {
        width: min(100% - 36px, 960px);
      }

      main {
        min-height: calc(100vh - 64px);
      }

      .intro {
        grid-template-columns: 1fr;
        align-items: end;
        gap: 30px;
        min-height: 300px;
        padding: 52px 0 42px;
      }

      .intro h1 {
        font-size: clamp(48px, 15vw, 68px);
      }

      .intro h1 span {
        display: block;
        margin-top: 18px;
        margin-left: 0;
        font-size: clamp(24px, 7vw, 34px);
      }

      .meta {
        grid-template-columns: auto 1fr;
        align-items: baseline;
        gap: 12px;
      }

      .project {
        grid-template-columns: 48px minmax(0, 1fr) 20px;
        gap: 12px;
        min-height: 92px;
      }

      .project-number {
        font-size: 24px;
      }

      .project-name {
        font-size: 20px;
      }

      .project-kind {
        display: none;
      }

      footer {
        min-height: 64px;
      }
    }

    @media (max-width: 380px) {
      .shell {
        width: min(100% - 28px, 960px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">Muhammadamin<br>Pulatov <span>Group 201</span></h1>
        <div class="meta">
          <span>Web dasturlash</span>
        </div>
      </section>

      <section class="works" id="works" aria-labelledby="works-title">
        <div class="works-heading">
          <h2 id="works-title">Loyihalar</h2>
          <p>2 ish</p>
        </div>

        <a class="project" href="./FlexBox/index.html">
          <span class="project-number">01</span>
          <span class="project-name">Flexbox mashqlari</span>
          <span class="project-kind">HTML / CSS</span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>

        <a class="project" href="./ipak-yoli/index.html">
          <span class="project-number">02</span>
          <span class="project-name">Ipak yo‘li Tours</span>
          <span class="project-kind">Sayohat sahifasi</span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
      </section>
    </main>

    <footer>
      <span>© 2026</span>
      <a href="../../">Guruh 201</a>
    </footer>
  </div>
</body>
</html>
